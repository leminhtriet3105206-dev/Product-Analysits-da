services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://analytics:analytics@db:5432/analytics
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-this-is-a-demo-only-key-0123456789}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  dashboard:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      SHOW_DEMO_HINT: ${SHOW_DEMO_HINT:-true}
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  pgdata:
